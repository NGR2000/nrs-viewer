<script>
'use strict';
const data=JSON.parse(document.getElementById('dataset').textContent);let eventIndex=data.standings?-1:0,taskIndex=0,tab='scores';
const $=id=>document.getElementById(id);const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function table(headers,rows){return '<div class="scroll"><table><thead><tr>'+headers.map(x=>'<th>'+e(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+e(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function current(){return data.events[eventIndex].tasks[taskIndex]}
function navigation(){

 document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{eventIndex=+b.dataset.event;taskIndex=0;render()});
}
function renderStandings(){const s=data.standings;navigation();
 $('cards').innerHTML=[['登録選手',s.rows.length],['得点のある選手',s.rows.filter(r=>r.count>0).length],['集計時点',s.as_of],['計算方法','独立計算']].map(([a,b])=>'<div class="card"><span class="muted">'+e(a)+'</span><span class="num">'+e(b)+'</span></div>').join('');

 $('content').innerHTML='<div class="controls"><input id="rankingSearch" aria-label="氏名・登録番号で総合成績を検索" placeholder="氏名・登録番号で検索"><span class="muted">横にスクロールすると上位7タスクの内訳を確認できます。</span></div><div id="rankingRows"></div>';
 const show=()=>{const q=$('rankingSearch').value.toLowerCase();const rows=s.rows.filter(r=>(r.name+' '+r.registration_id).toLowerCase().includes(q));$('rankingRows').innerHTML=rows.length?table(['暫定順位','氏名','NRS登録番号','得点（加点前）','採用数','平均','上位7合計','加点','Top1','Top2','Top3','Top4','Top5','Top6','Top7'],rows.map(r=>[r.rank,r.name,r.registration_id,Number(r.total).toFixed(2),r.count,Number(r.average).toFixed(2),r.top7.reduce((a,v)=>a+Number(v||0),0),r.bonus===null?'未確認':r.bonus,...r.top7])):'<div class="empty">該当する選手はいません</div>';};$('rankingSearch').oninput=show;show();

}
function render(){if(eventIndex===-1){renderStandings();return;}const event=data.events[eventIndex],t=current(),source=t.view_kind==='source';navigation();

 $('eventTitle').textContent=event.name;$('updated').textContent='読込結果の保存日時：'+new Date(event.updated).toLocaleString('ja-JP')+' ／ 静的スナップショット';
 $('task').innerHTML=event.tasks.map((v,i)=>'<option value="'+i+'">'+e(v.reference_sheet+' · '+v.task_type+' — '+v.file)+'</option>').join('');$('task').value=taskIndex;
 $('status').innerHTML='<span class="tag '+(t.status==='system_calculated'?'good':'')+'">'+(source?'原本検証済み・NRS計算結果未接続':t.status==='system_calculated'?'原本＋登録者リストから独立計算':'要確認')+'</span> <span class="tag warn">'+(t.aggregation_status==='excluded'?'総合集計対象外：全員グループB':'暫定総合集計に採用')+'</span>';
 $('steps').innerHTML=[['01 読込',t.source_count+'名'],['02 No Flight',t.no_flight_count+'名を除外'],['03 登録照合',source?'未接続':t.matched_count+'名を対応'],['04 計算・照合',source?'この画面には未接続':t.verification?.status==='match'?'独立計算・検算一致':t.verification?.status==='different'?'独立計算・検算差あり':'独立計算済み']].map(([a,b])=>'<div class="step"><small>'+a+'</small><div>'+b+'</div></div>').join('');
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 if(tab==='scores'){
 $('content').innerHTML=(source?'<div class="notice">以下は大会の原本得点です。NRSの再計算得点ではありません。佐賀#12も原本は保存しています。</div>':'<p class="muted">大会内選手番号で表示。Pointsは減点前、Scoreは減点後のNRS試算値です。</p>')+'<div class="controls"><input id="search" aria-label="選手番号・登録番号で検索" placeholder="選手番号・登録番号で検索"><label>並び順 <select id="order"><option value="rank">順位</option><option value="score">Scoreが高い順</option><option value="id">選手番号</option></select></label></div><div id="rows"></div>';

 }else if(tab==='checks'){
 if(source){$('content').innerHTML='<div class="notice">取得・形式検証のみのデータです。登録者照合とNRS計算の経過はまだこのデータに接続していません。</div>';}
 else{$('content').innerHTML='<p class="muted">Excelは検算だけに使用しています。差があっても得点や対象者をExcelの値に戻しません。</p><h3>得点差分・対象者差分</h3>'+table(['得点差分','Excelにのみ存在','今回のみ存在'],[[t.differences.length,t.missing_reference_pilots.length,t.extra_pilots.length]])+'<h3>登録者リストとの表記ゆれ正規化</h3><p class="muted">空白・全半角・ローマ字表記の正規化結果です。計算シートの登録番号は参照していません。同名候補が複数ある場合は計算を停止します。</p>'+table(['選手番号','原本表記','NRS登録番号','根拠'],(t.normalized_matches||[]).map(a=>[a.competitor_number,a.source_name,a.registration_id,a.evidence]))+'<h3>未一致・登録日による確認待ち</h3><p class="muted">未登録とは断定していません。総合集計への採用前に確認が必要です。</p>'+table(['選手番号','原本表記','状態'],t.unresolved_names.map(r=>[r.competitor_number,r.source_name,'名前または登録日を要確認']))+(t.calculation.error?'<div class="notice">'+e(t.calculation.error)+'</div>':'');}
 }else{
 const c=t.calculation||{};let details=[['原本',t.file],['原本SHA-256',t.sha256||'原本取得時のmanifestを参照'],['登録者スナップショット',t.registry_file||'非公開（大会時点の登録者リストを使用）'],['登録者SHA-256',t.registry_sha256||'—'],['集計状態',t.aggregation_status],['除外理由',t.aggregation_exclusion_reason||'—']];

 $('footer').textContent='ビューアー生成：'+new Date(data.generated_at).toLocaleString('ja-JP')+'。同一タスクの別原本は切替で比較できます。上部件数は計算シート単位で重複を除外しています。公開許可された氏名・NRS登録番号・成績を表示しています。連絡先・登録台帳の詳細は含みません。';
