<script>
'use strict';
const data=JSON.parse(document.getElementById('dataset').textContent);let eventIndex=data.standings?-1:0,taskIndex=0,tab='scores';
const $=id=>document.getElementById(id);const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function table(headers,rows){return '<div class="scroll"><table><thead><tr>'+headers.map(x=>'<th>'+e(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+e(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function current(){return data.events[eventIndex].tasks[taskIndex]}
function navigation(){
 $('events').innerHTML=(data.standings?'<button class="event '+(eventIndex===-1?'active':'')+'" data-event="-1">総合成績</button><button class="event '+(eventIndex===-2?'active':'')+'" data-event="-2">Excelとの差分詳細</button><button class="event '+(eventIndex===-3?'active':'')+'" data-event="-3">登録者一覧</button>':'')+data.events.map((v,i)=>'<button class="event '+(i===eventIndex?'active':'')+'" data-event="'+i+'">'+e(v.name)+'</button>').join('');
 document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{eventIndex=+b.dataset.event;taskIndex=0;render()});
}
function renderOverview(){
 navigation();$('task').closest('.controls').hidden=true;$('steps').hidden=true;document.querySelector('.tabs').hidden=true;
 $('updated').textContent='2026年 佐賀ＩＢＦまで ／ 検証用スナップショット';
 const tasks=data.events.flatMap((event,ei)=>event.tasks.map((task,ti)=>({event,ei,task,ti}))).filter(x=>x.task.verification?.status==='different');
 if(eventIndex===-3){
  const rows=[...data.standings.rows].sort((a,b)=>a.registration_id.localeCompare(b.registration_id));
  $('eventTitle').textContent='登録者一覧';$('cards').innerHTML='<div class="card"><span class="muted">登録者</span><span class="num">'+rows.length+'名</span></div>';
  $('status').innerHTML='<div class="notice">佐賀大会までの登録者を表示しています。大会の競技予定初日までに登録した選手を、その大会の計算対象とします。</div>';
  $('content').innerHTML='<div class="controls"><input id="registrySearch" aria-label="登録者を検索" placeholder="氏名・登録番号・会員番号で検索"></div><div id="registryRows"></div>';
  const show=()=>{const q=$('registrySearch').value.toLowerCase();const found=rows.filter(r=>(r.registration_id+' '+r.name+' '+r.member_number).toLowerCase().includes(q));$('registryRows').innerHTML=found.length?table(['NRS登録番号','氏名','連盟会員番号','NRS登録日'],found.map(r=>[r.registration_id,r.name,r.member_number||'—',r.effective_date||'—'])):'<div class="empty">該当する登録者はいません</div>';};$('registrySearch').oninput=show;show();
 }else{
  $('eventTitle').textContent='Excelと差があるタスク';$('cards').innerHTML='<div class="card"><span class="muted">差があるタスク</span><span class="num">'+tasks.length+'</span></div>';
  $('status').innerHTML='<div class="notice">競技結果と登録者リストからのシステム計算を、Excelの計算結果と比較しています。差があることだけでは、どちらが正しいかは決まりません。Pointsは減点前、Scoreは減点後です。</div>';
  $('content').innerHTML=tasks.length?tasks.map(({event,ei,task,ti})=>{const v=task.verification;const differences=v.differences||[];const identify=id=>[id,task.display_names?.[String(id)]||'—',task.identity_map?.[String(id)]||'—'];return '<section><h3>'+e(event.name+' '+task.reference_sheet)+'</h3><button class="linkbutton" data-jump="'+ei+','+ti+'">このタスクの得点一覧を見る</button><p class="muted">得点差 '+differences.length+'名 ／ システム計算のみ '+(v.extra_pilots||[]).length+'名 ／ Excelのみ '+(v.missing_reference_pilots||[]).length+'名</p>'+ (differences.length?table(['選手番号','氏名','NRS登録番号','システムPoints','Excel Points','システムScore','Excel Score'],differences.map(r=>[...identify(r.pilot_id),r.system_points,r.excel_points,r.system_score,r.excel_score])):'')+((v.extra_pilots||[]).length?'<p>システム計算のみの選手番号：'+e(v.extra_pilots.join('、'))+'</p>':'')+((v.missing_reference_pilots||[]).length?'<p>Excelのみの選手番号：'+e(v.missing_reference_pilots.join('、'))+'</p>':'')+'</section>';}).join(''):'<div class="empty">差があるタスクはありません</div>';
  document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{[eventIndex,taskIndex]=b.dataset.jump.split(',').map(Number);tab='scores';render()});
 }
 $('footer').textContent='Excelは検算のために使用しています。システム計算の値をExcelで置き換えていません。';
}
function renderStandings(){const s=data.standings;navigation();

 $('content').innerHTML='<div class="controls"><input id="rankingSearch" aria-label="氏名・登録番号で総合成績を検索" placeholder="氏名・登録番号で検索"><span class="muted">横にスクロールすると上位7タスクの内訳を確認できます。</span></div><div id="rankingRows"></div>';

}
function render(){if(eventIndex===-1){renderStandings();return;}if(eventIndex===-2||eventIndex===-3){renderOverview();return;}const event=data.events[eventIndex],t=current(),source=t.view_kind==='source';navigation();
 $('task').closest('.controls').hidden=false;$('steps').hidden=false;document.querySelector('.tabs').hidden=false;
 const computed=data.events.flatMap(x=>x.tasks).filter(x=>x.view_kind==='calculated'),unique=[...new Map(computed.map(x=>[x.reference_sheet,x])).values()];

 $('task').innerHTML=event.tasks.map((v,i)=>'<option value="'+i+'">'+e(v.reference_sheet+' · '+v.task_type+' — '+v.file)+'</option>').join('');$('task').value=taskIndex;
 $('status').innerHTML='<span class="tag '+(t.status==='system_calculated'?'good':'')+'">'+(source?'原本検証済み・NRS計算結果未接続':t.status==='system_calculated'?'原本＋登録者リストからシステム計算':'要確認')+'</span> <span class="tag warn">'+(t.aggregation_status==='excluded'?'総合集計対象外：全員グループB':'暫定総合集計に採用')+'</span>';
