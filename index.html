'use strict';
const data=JSON.parse(document.getElementById('dataset').textContent);let eventIndex=0,taskIndex=0,tab='scores';

function table(headers,rows){return '<div class="scroll"><table><thead><tr>'+headers.map(x=>'<th>'+e(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+e(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function current(){return data.events[eventIndex].tasks[taskIndex]}
function render(){const event=data.events[eventIndex],t=current(),source=t.view_kind==='source';
 $('events').innerHTML=data.events.map((v,i)=>'<button class="event '+(i===eventIndex?'active':'')+'" data-event="'+i+'">'+e(v.name)+'</button>').join('');
 document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{eventIndex=+b.dataset.event;taskIndex=0;render()});
 const computed=data.events.flatMap(x=>x.tasks).filter(x=>x.view_kind==='calculated'),unique=[...new Map(computed.map(x=>[x.reference_sheet,x])).values()];

 $('eventTitle').textContent=event.name;$('updated').textContent='読込結果の保存日時：'+new Date(event.updated).toLocaleString('ja-JP')+' ／ 静的スナップショット';
 $('task').innerHTML=event.tasks.map((v,i)=>'<option value="'+i+'">'+e(v.reference_sheet+' · '+v.task_type+' — '+v.file)+'</option>').join('');$('task').value=taskIndex;
 $('status').innerHTML='<span class="tag '+(t.status==='legacy_values_match'?'good':'')+'">'+(source?'原本検証済み・NRS計算結果未接続':t.status==='legacy_values_match'?'ExcelのPoints / Scoreと一致':'要確認')+'</span> <span class="tag warn">'+(t.aggregation_status==='excluded'?'総合集計対象外：全員グループB':'総合集計の採用は未確定')+'</span>';
 $('steps').innerHTML=[['01 読込',t.source_count+'名'],['02 No Flight',t.no_flight_count+'名を除外'],['03 登録照合',source?'未接続':t.matched_count+'名を対応'],['04 計算・照合',source?'この画面には未接続':t.status==='legacy_values_match'?'保存値と一致':'確認が必要']].map(([a,b])=>'<div class="step"><small>'+a+'</small><div>'+b+'</div></div>').join('');
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 if(tab==='scores'){
 $('content').innerHTML=(source?'<div class="notice">以下は大会の原本得点です。NRSの再計算得点ではありません。佐賀#12も原本は保存しています。</div>':'<p class="muted">大会内選手番号で表示。Pointsは減点前、Scoreは減点後のNRS試算値です。</p>')+'<div class="controls"><input id="search" aria-label="選手番号で検索" placeholder="選手番号で検索"><label>並び順 <select id="order"><option value="rank">順位</option><option value="score">Scoreが高い順</option><option value="id">選手番号</option></select></label></div><div id="rows"></div>';
 const show=()=>{let rows=source?t.rows.map(r=>({pilot_id:String(r.competitor_number),rank:r.source_rank,points:r.points,score:r.score,label:r.eligible_by_flight?r.performance:'No Flight（除外）'})):(t.calculation.rows||[]).map(r=>({...r,label:t.identity_map[r.pilot_id]||''}));const q=$('search').value.toLowerCase();rows=rows.filter(r=>[r.pilot_id,r.label].join(' ').toLowerCase().includes(q));rows.sort((a,b)=>$('order').value==='score'?Number(b.score)-Number(a.score):$('order').value==='id'?Number(a.pilot_id)-Number(b.pilot_id):Number(a.rank)-Number(b.rank));$('rows').innerHTML=rows.length?table([source?'大会順位':'試算順位','選手番号',source?'原本Performance':'登録情報（非公開）','Points','Score'],rows.map(r=>[r.rank,r.pilot_id,r.label,r.points,r.score])):'<div class="empty">該当する選手はいません</div>';};$('search').oninput=show;$('order').onchange=show;show();
 }else if(tab==='checks'){
 if(source){$('content').innerHTML='<div class="notice">取得・形式検証のみのデータです。登録者照合とNRS計算の経過はまだこのデータに接続していません。</div>';}
 else{$('content').innerHTML='<h3>得点差分・対象者差分</h3>'+table(['得点差分','Excelにのみ存在','今回のみ存在'],[[t.differences.length,t.missing_reference_pilots.length,t.extra_pilots.length]])+'<h3>名前の対応情報は公開版では非表示</h3><p class="muted">本人確認を独立に完了した意味ではありません。既存ブックの選手番号と登録番号を照合した記録です。</p>'+table(['選手番号','原本表記','登録情報（非公開）','根拠'],(t.legacy_backed_aliases||[]).map(a=>[a.competitor_number,a.source_name,a.registration_id,a.evidence]))+'<h3>未一致の個別情報は公開版では非表示</h3><p class="muted">未登録とは断定していません。総合集計への採用前に確認が必要です。</p>'+table(['選手番号','原本表記','状態'],t.unresolved_names.map(r=>[r.competitor_number,r.source_name,'名前または登録日を要確認']))+(t.calculation.error?'<div class="notice">'+e(t.calculation.error)+'</div>':'');}
 }else{
 const c=t.calculation||{};let details=[['原本',t.file],['原本SHA-256',t.sha256||'原本取得時のmanifestを参照'],['登録者スナップショット',t.registry_file||'未接続'],['登録者SHA-256',t.registry_sha256||'—'],['集計状態',t.aggregation_status],['除外理由',t.aggregation_exclusion_reason||'—']];
 $('content').innerHTML='<div class="details">'+details.map(([a,b])=>'<strong>'+e(a)+'</strong><div>'+e(b)+'</div>').join('')+'</div>'+(source?'':'<h3>計算パラメータ</h3>'+table(['P 参加人数','A 数値結果人数','M 中間順位','W 最良結果','RM 中間結果','SM 中間得点'],[[c.P,c.A,c.M,c.W,c.RM,c.SM]]))+'<h3>適用した処理</h3><ol><li>No Flightを除外し、No Resultは保持。</li><li>大会時点の登録情報に照合。名前の補完根拠を記録。</li><li>調整済み結果からPointsを計算。</li><li>Score = max(Points − |タスクペナルティ|, 0) − |競技ペナルティ|。</li><li>Score順に並べ、同点は同順位。</li></ol><div class="notice">年間ランキングはまだ確定していません。渡良瀬#05の2種類などの採用判断、登録者の未一致確認が残っています。佐賀#12は規程第4条(3)により集計対象外です。</div><p class="muted">この画面は保存された計算経過を表示します。計算の実行や元データの変更は行いません。</p>';
 }
 $('footer').textContent='ビューアー生成：'+new Date(data.generated_at).toLocaleString('ja-JP')+'。同一タスクの別原本は切替で比較できます。上部件数は計算シート単位で重複を除外しています。公開版は氏名・NRS登録番号・登録台帳情報を含みません。大会内選手番号と成績は公開表示しています。';
}
$('task').onchange=()=>{taskIndex=+$('task').value;render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
